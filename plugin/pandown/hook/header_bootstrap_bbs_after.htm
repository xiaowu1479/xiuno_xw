<style id="pandown-css">
/* 网盘下载按钮 — 参照 pan-downloader-xiaowu 设计 */
.pandown-download {
    display: inline-block;
    /* 上下留 1em；右侧也留一点：连着点两次「添加网盘链接」时，两个 [pd url] 标签
       是紧贴的（thread_info_end.php 直接 str_replace），渲染出来的按钮会挨在一起
       —— 原来的 margin: 1em 0 只有上下没有左右，所以两个按钮之间没有间隙。
       加上右间距后相邻按钮之间会有可见间隙；单个按钮或换行的按钮，右侧间距不可见，观感不变 */
    margin: 1em 0.5em 1em 0;
}
.pandown-btn {
    display: inline-flex !important;
    align-items: center;
    gap: 0.4em;
    border-radius: 4px;
    transition: 0.15s;
    border: 1px solid transparent;
    vertical-align: middle;
    padding: 0.5em 1.2em !important;
    text-align: center;
    font-weight: 400;
    line-height: 1.44;
    cursor: pointer;
    text-decoration: none !important;
    white-space: nowrap;
    font-size: 14px !important;
}
.pandown-btn:hover {
    opacity: 0.85;
    text-decoration: none !important;
}
.pandown-btn .pandown-icon {
    flex-shrink: 0;
}

/* ── 网盘二维码弹窗：让二维码的白底不再和弹窗背景"糊成一片" ──
   二维码是黑块 + 白底的 PNG，白底那圈静区是扫码必需的，不能去掉；所以这里不改结构、不改尺寸，
   只把弹窗内容区铺一层极淡的底，让白色二维码成为一张有边界的卡片：
   - 浅色：#f6f7f9 浅灰底 + 白色二维码卡片
   - 夜间：#22262e 深灰底，白色二维码不再是生硬的一整块白方块
   作用范围限定在 #pandown_qr_modal，不影响站内其它弹窗 */
#pandown_qr_modal .modal-body {
    background: #f6f7f9;
    border-radius: 0 0 5px 5px;
}
#pandown_qr_modal #pandown_qr_image {
    border-radius: 8px;
}
/* 内容区铺灰后，原来的 bg-light 链接框会和底色几乎同色，换成白色小卡片把它衬出来
   （bootstrap 的 .bg-light 自带 !important，所以这里也需要 !important）；
   四个角明显加圆：bootstrap 的 .rounded 只有 4.8px，8px 看着还是偏"方"，
   这里给 16px（框高约 37px，两端接近半圆），链接换行成两行时也不会变形 */
#pandown_qr_modal #pandown_qr_url_display {
    background: #fff !important;
    border: 1px solid #ecedf1;
    border-radius: 16px;
}
html[data-theme="dark"] #pandown_qr_modal .modal-body {
    background: #22262e;
}
html[data-theme="dark"] #pandown_qr_modal #pandown_qr_url_display {
    background: #2a2f38 !important;
    border-color: #363c46;
}
</style>
