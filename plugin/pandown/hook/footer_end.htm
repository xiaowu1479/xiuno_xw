<?php if(!empty($GLOBALS['has_pandown'])): 
// 移动端检测
$is_mobile = preg_match('/(android|iphone|ipad|ipod|mobile|blackberry|iemobile|opera mini|windows phone)/i', $_SERVER['HTTP_USER_AGENT'] ?? '');
// PC端是否也显示完整弹窗（链接、打开、复制按钮）
$pandown_setting = setting_get('pandown_setting');
$full_display = $is_mobile || !empty($pandown_setting['pc_full']);
?>
<!-- 网盘链接二维码弹窗 -->
<div class="modal fade" id="pandown_qr_modal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">网盘链接</h5>
				<button type="button" class="close" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>

				<div id="pandown_qr_loading" class="text-muted small mb-2" style="display:none;">正在获取最新链接…</div>
				<img id="pandown_qr_image" src="" alt="二维码" style="max-width:280px;width:100%;height:auto;" />
				<?php if($full_display): ?>
				<div id="pandown_qr_url_display" class="mt-2 p-2 bg-light rounded text-break small text-muted"></div>
				<p class="mt-3">
					<button type="button" class="btn btn-outline-secondary" onclick="pandownCopyLink()">复制链接</button>
					<a id="pandown_qr_link" href="#" target="_blank" rel="noopener" class="btn btn-primary">打开链接</a>
				</p>
				<?php endif; ?>
				<p class="text-muted small mt-3 mb-0">手机扫码或点击按钮打开链接</p>
				<p class="text-muted small mb-0">为了阻止网络爬虫爬取资源进行售卖，请扫描上方二维码下载，或直接手机访问下载，感谢您的理解与支持！</p>
			</div>
		</div>
	</div>
</div>

<script>
var pandownReqSeq = 0;
$(document).on('click', '.pandown-btn', function() {
	var $btn = $(this);
	var url = $btn.data('url');
	var qr = $btn.data('qr');
	var pid = $btn.data('pid');
	var idx = $btn.data('idx');
	if(!url) return;
	$('#pandown_qr_loading').hide();
	$('#pandown_qr_image').attr('src', qr).show();
	$('#pandown_qr_link').attr('href', url);
	<?php if($full_display): ?>
	$('#pandown_qr_url_display').text(url);
	<?php endif; ?>
	// 兼容 Bootstrap 4（当前系统使用）与 Bootstrap 5 两种弹窗 API
	var modalEl = document.getElementById('pandown_qr_modal');
	if (modalEl) {
		if (window.bootstrap && bootstrap.Modal && bootstrap.Modal.getOrCreateInstance) {
			bootstrap.Modal.getOrCreateInstance(modalEl).show();
		} else if ($.fn.modal) {
			$(modalEl).modal('show');
		} else {
			$(modalEl).addClass('show').css('display', 'block');
			$('body').addClass('modal-open');
			$('<div class="modal-backdrop fade show"></div>').appendTo(document.body);
		}
	}

	// 服务端异步转存：成功则换成新链接并静默替换，失败则保留原来的二维码。
	// 转存期间不要藏起原二维码，否则慢的时候用户会长时间看到空白。
	if(!pid) return false;
	var seq = ++pandownReqSeq;
	$('#pandown_qr_loading').show();
	$.ajax({
		url: '<?php echo url('pandown-resolve');?>',
		type: 'POST',
		dataType: 'json',
		timeout: 40000,
		data: {
			pid: pid,
			idx: idx
		}
	}).done(function(res) {
		if(seq !== pandownReqSeq) return;
		if(res && res.resolved && res.url && res.qr) {
			$('#pandown_qr_image').attr('src', res.qr);
			$('#pandown_qr_link').attr('href', res.url);
			<?php if($full_display): ?>
			$('#pandown_qr_url_display').text(res.url);
			<?php endif; ?>
		}
	}).always(function() {
		if(seq !== pandownReqSeq) return;
		$('#pandown_qr_loading').hide();
		// 未转存成功时保持原链接（弹窗打开时已经设置好了），无需任何回退动作
	});
	return false;
});

<?php if($full_display): ?>
function pandownCopyLink() {
	var url = $('#pandown_qr_link').attr('href');
	if(navigator.clipboard) {
		navigator.clipboard.writeText(url).then(function() {
			$.alert('链接已复制');
		})['catch'](function() {
			pandownCopyFallback(url);
		});
	} else {
		pandownCopyFallback(url);
	}
}
function pandownCopyFallback(url) {
	var $temp = $('<input>');
	$('body').append($temp);
	$temp.val(url).select();
	document.execCommand('copy');
	$temp.remove();
	$.alert('链接已复制');
}
<?php endif; ?>
</script>
<?php endif; ?>
