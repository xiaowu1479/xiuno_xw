<script>
$(document).on('click', '.pandown-btn', function() {
	var url = $(this).data('url');
	var qr = $(this).data('qr');
	if(!url) return;
	$('#pandown_qr_image').attr('src', qr);
	$('#pandown_qr_link').attr('href', url);
	<?php if($is_mobile): ?>
	$('#pandown_qr_url_display').text(url);
	<?php endif; ?>
	var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('pandown_qr_modal'));
	modal.show();
	return false;
});

<?php if($is_mobile): ?>
function pandownCopyLink() {
	var url = $('#pandown_qr_link').attr('href');
	if(navigator.clipboard) {
		navigator.clipboard.writeText(url).then(function() {
			$.alert('链接已复制');
		})['catch'](function() {
			pandownCopyFallback(url);
		});
	} else {
		pandownCopyFallback(url);
	}
}
function pandownCopyFallback(url) {
	var $temp = $('<input>');
	$('body').append($temp);
	$temp.val(url).select();
	document.execCommand('copy');
	$temp.remove();
	$.alert('链接已复制');
}
<?php endif; ?>
</script>
<?php endif; ?>
