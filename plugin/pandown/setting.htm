<div class="row">
	<div class="col-lg-10 mx-auto">
		<div class="card">
			<div class="card-body">
				<h3>网盘链接转二维码 - 设置</h3>
				<form method="post" action="<?php echo url('plugin-setting-pandown');?>" id="form_setting">
					<input type="hidden" name="op" value="save">
					<table class="table">
						<tr>
							<th style="width:200px;">自动清除二维码</th>
							<td>
								<label class="checkbox-inline">
									<input type="checkbox" name="clear_qrcode" value="1" <?php echo $setting['clear_qrcode'] ? 'checked' : '';?>>
									启用（删除帖子时自动清除对应的二维码缓存）
								</label>
							</td>
						</tr>
						<tr>
							<th>二维码缓存</th>
							<td>
								<button type="button" class="btn btn-danger" id="btn_clear">立即清除所有二维码缓存</button>
								<span class="text-muted ml-2 small">删除 plugin/pandown/cache/ 目录下所有二维码图片</span>
							</td>
						</tr>
					</table>
					<div class="form-actions">
						<button type="submit" class="btn btn-primary">保存设置</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<script>
$('#form_setting').on('submit', function() {
	var form = $(this);
	$.xpost(form.attr('action'), form.serialize(), function(code, message) {
		if (code == 0) $.alert(message);
		else $.alert(message);
	});
	return false;
});
$('#btn_clear').on('click', function() {
	if(!confirm('确定要清除所有二维码缓存吗？')) return;
	var btn = $(this);
	btn.prop('disabled', true).text('清除中...');
	$.xpost('<?php echo url('plugin-setting-pandown');?>', {op: 'clear'}, function(code, message) {
		btn.prop('disabled', false).text('立即清除所有二维码缓存');
		if (code == 0) $.alert(message);
		else $.alert(message);
	});
});
</script>
