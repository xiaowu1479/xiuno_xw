<!--{hook huux_tinymce_thread_js_before.htm}-->
<script type="text/javascript">
if (typeof huux_tinymce_default == 'undefined') {
    // TinyMCE 5.2 + PrismJS 1.19
    if ($('div.message pre[class*="language-"]')[0]) {
        $.require_css('plugin/huux_tinymce/prism/prism.css');
        $.require('plugin/huux_tinymce/prism/prism.js');
    }
    $.require_css('plugin/huux_tinymce/tinymce/style.css?v2.1.17');
}
$(document).on('click', '.huux-hide-box__reply-link', function(e) {
    if ($(this).attr('href') !== '#message') return;
    e.preventDefault();
    var target = document.getElementById('message');
    if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    var editor = window.tinymce && tinymce.get('message');
    if (editor) {
        setTimeout(function() { editor.focus(); }, 250);
    } else {
        setTimeout(function() { $('#message').focus(); }, 250);
    }
});
</script>
<!--{hook huux_tinymce_thread_js_after.htm}-->
