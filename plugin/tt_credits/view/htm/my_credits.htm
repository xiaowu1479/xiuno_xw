<script>
$(document).ready(function() {
    // 设置TAB激活状态
    $('a[data-active="my-credits"]').addClass('active');
    
    // 积分卡片点击效果
    $('.credit-card').on('click', function() {
        $(this).addClass('shadow-lg');
        setTimeout(() => {
            $(this).removeClass('shadow-lg');
        }, 300);
    });
    
    // 功能卡片悬停效果
    $('.function-card').hover(
        function() {
            $(this).find('i').addClass('fa-pulse');
        },
        function() {
            $(this).find('i').removeClass('fa-pulse');
        }
    );
    
    // 添加数字动画效果
    function animateNumbers() {
        $('.credit-card h2').each(function() {
            const $this = $(this);
            const finalValue = parseInt($this.text().replace(/,/g, ''));
            if (finalValue > 0) {
                $this.prop('Counter', 0).animate({
                    Counter: finalValue
                }, {
                    duration: 1000,
                    easing: 'swing',
                    step: function(now) {
                        $this.text(Math.ceil(now).toLocaleString());
                    }
                });
            }
        });
    }
    
    // 页面加载完成后执行动画
    setTimeout(animateNumbers, 500);
});
</script>
