<script>
$(document).ready(function() {
    // 设置TAB激活状态
    $('a[data-active="my-trade"]').addClass('active');
    
    // RMB兑换金币
    var jinput = $("#e_rmb");
    var jsubmit1 = $('#submit1');
    var jgolds = $("#e_golds");
    
    jinput.on('input', function() {
        ONInput(jinput);
    });
    
    jsubmit1.on('click', function() {
        var amount = jinput.val();
        if(!amount || amount == '0') {
            $.alert('请输入有效的兑换金额！');
            return false;
        }
        
        $.confirm('确定要兑换 ' + amount + ' <?php echo lang('credits3'); ?> 吗？', function() {
            jsubmit1.addClass('loading').prop('disabled', true);
            
            var postdata = "e_rmb=" + amount + "&op=n";
            $.xpost(jsubmit1.attr('data-active'), postdata, function(code, message) {
                jsubmit1.removeClass('loading').prop('disabled', false);
                
                if(code == 0) {
                    $.alert(message, function() {
                        location.reload();
                    });
                } else {
                    $.alert(message);
                }
            });
        });
    });
    
    function ONInput(input) {
        var value = input.val().replace(/[^0-9]/g, '');
        input.val(value);
        
        var rmb_input = value == '' ? 0 : parseInt(value);
        var golds_get = rmb_input * parseFloat("<?php echo $set['exchange_n']; ?>");
        var rmb_unit_rate = parseFloat("<?php echo $rmb_unit_info['rate']; ?>");
        
        jgolds.text(golds_get.toFixed(1));
        $("#show_rmb_yuan").text((rmb_input / rmb_unit_rate).toFixed(3));
        
        // 添加动画效果
        if(golds_get > 0) {
            jgolds.addClass('text-warning').removeClass('text-muted');
        } else {
            jgolds.addClass('text-muted').removeClass('text-warning');
        }
    }
    
    <?php if($convert == 1): ?>
    // 金币兑换RMB
    var jinput2 = $("#e_golds_c");
    var jsubmit2 = $('#submit2');
    var jrmbs = $("#e_rmbs_c");
    
    jinput2.on('input', function() {
        ONInput2(jinput2);
	});
    
    jsubmit2.on('click', function() {
        var amount = jinput2.val();
        if(!amount || amount == '0') {
            $.alert('请输入有效的兑换金额！');
            return false;
        }
        
        $.confirm('确定要兑换 ' + amount + ' <?php echo lang('credits2'); ?> 吗？', function() {
            jsubmit2.addClass('loading').prop('disabled', true);
            
            var postdata = "e_golds_c=" + amount + "&op=c";
            $.xpost(jsubmit2.attr('data-active'), postdata, function(code, message) {
                jsubmit2.removeClass('loading').prop('disabled', false);
                
                if(code == 0) {
                    $.alert(message, function() {
                        location.reload();
                    });
                } else {
                    $.alert(message);
                }
        });
    });
    });
    
    function ONInput2(input) {
        var value = input.val().replace(/[^0-9]/g, '');
        input.val(value);
        
        var golds_input = value == '' ? 0 : parseInt(value);
        var rmb_get = golds_input * parseFloat("<?php echo $set['exchange_c']; ?>");
        var rmb_unit_rate = parseFloat("<?php echo $rmb_unit_info['rate']; ?>");
        
        jrmbs.text(rmb_get.toFixed(1));
        $("#e_rmbs_c_yuan").text((rmb_get / rmb_unit_rate).toFixed(3));
        
        // 添加动画效果
        if(rmb_get > 0) {
            jrmbs.addClass('text-success').removeClass('text-muted');
        } else {
            jrmbs.addClass('text-muted').removeClass('text-success');
        }
    }
    <?php endif; ?>
    
    // 转账功能
    var jtransfer_submit = $('#transfer-submit');
    
    jtransfer_submit.on('click', function() {
        var username = $('#to_username').val().trim();
        var credits_type = $('#credits_type').val();
        var amount = $('#to_num').val();
        
        // 验证输入
        if(!username) {
            $.alert('请输入接收用户名！');
            return false;
        }
        
        if(username.length > 32) {
            $.alert('用户名长度不能超过32个字符！');
            return false;
        }
        
        if(!amount || amount == '0') {
            $.alert('请输入有效的转账金额！');
            return false;
        }
        
        var credits_name = credits_type == 'golds' ? '<?php echo lang('credits2'); ?>' : '<?php echo lang('credits3'); ?>';
        
        $.confirm('确定要转账 ' + amount + ' ' + credits_name + ' 给用户 "' + username + '" 吗？<br><small class="text-danger">转账后无法撤销！</small>', function() {
            jtransfer_submit.addClass('loading').prop('disabled', true);
            
            var postdata = "to_username=" + username + "&credits_type=" + credits_type + "&to_num=" + amount + "&op=t";
            $.xpost(jtransfer_submit.attr('data-active'), postdata, function(code, message) {
                jtransfer_submit.removeClass('loading').prop('disabled', false);
                
                if(code == 0) {
                    $.alert(message, function() {
                        // 清空表单
                        $('#to_username').val('');
                        $('#to_num').val('');
                        $('#credits_type').val('golds');
                        location.reload();
                    });
                } else {
                    $.alert(message);
                }
            });
        });
    });
    
    // 转账表单验证
    $('#to_username').on('input', function() {
        var value = $(this).val();
        // 移除特殊字符，只保留字母数字中文下划线
        value = value.replace(/[^\w\u4e00-\u9fa5]/g, '');
        $(this).val(value);
    });
    
    $('#to_num').on('input', function() {
        var value = $(this).val().replace(/[^0-9]/g, '');
        $(this).val(value);
    });
    
    // 功能卡片悬停效果
    $('.function-card').hover(
        function() {
            $(this).find('i').addClass('fa-pulse');
        },
        function() {
            $(this).find('i').removeClass('fa-pulse');
        }
    );
    
    // 输入框聚焦效果
    $('.form-control').on('focus', function() {
        $(this).closest('.input-group').addClass('shadow-sm');
    }).on('blur', function() {
        $(this).closest('.input-group').removeClass('shadow-sm');
    });
});
</script>
