<script>
var baseUrl = window.location.href;

function postAction(action, data, btn) {
    data = data || {};
    data.xw_nav_action = action;
    $(btn || '#body').loading();
    $.xpost(baseUrl, data, function(r) {
        $(btn || '#body').loading('close');
        if(r.code == 0 || r.code == '0') {
            $.alert(r.message || '操作成功', function(){ location.reload(); });
        } else {
            $.alert(r.message || '操作失败');
        }
    });
}

// 设置
$('#xw_nav_settings_form').on('submit', function(e) {
    e.preventDefault();
    var data = {};
    $(this).serializeArray().forEach(function(item) { data[item.name] = item.value; });
    postAction('save_settings', data, '#xw_nav_settings_form button[type="submit"]');
});

// 分类
function showCategoryModal() {
    $('#categoryModalTitle').text('添加分类');
    $('#cat_id').val('');
    $('#cat_title').val('');
    $('#cat_icon').val('');
    $('#cat_sort').val('0');
    $('#cat_status').val('1');
    $('#categoryModal').modal('show');
}

function editCategory(cat) {
    $('#categoryModalTitle').text('编辑分类');
    $('#cat_id').val(cat.id);
    $('#cat_title').val(cat.title);
    $('#cat_icon').val(cat.icon);
    $('#cat_sort').val(cat.sort_order);
    $('#cat_status').val(cat.status);
    $('#categoryModal').modal('show');
}

function submitCategory() {
    var id = $('#cat_id').val();
    var data = {
        id: id,
        title: $('#cat_title').val(),
        icon: $('#cat_icon').val(),
        sort_order: $('#cat_sort').val(),
        status: $('#cat_status').val()
    };
    postAction(id ? 'update_category' : 'add_category', data, '#catSubmitBtn');
}

// 链接
function showLinkModal() {
    $('#linkModalTitle').text('添加链接');
    $('#link_id').val('');
    $('#link_title').val('');
    $('#link_url').val('');
    $('#link_icon').val('');
    $('#link_color').val('#3b82f6');
    $('#link_desc').val('');
    $('#link_sort').val('0');
    $('#link_status').val('1');
    $('#link_target').val('1');
    if($('#link_category_id option').length) {
        $('#link_category_id').val($('#link_category_id option:first').val());
    }
    $('#linkModal').modal('show');
}

function editLink(link) {
    $('#linkModalTitle').text('编辑链接');
    $('#link_id').val(link.id);
    $('#link_title').val(link.title);
    $('#link_url').val(link.url);
    $('#link_icon').val(link.icon);
    $('#link_color').val(link.color || '#3b82f6');
    $('#link_desc').val(link.description);
    $('#link_sort').val(link.sort_order);
    $('#link_status').val(link.status);
    $('#link_target').val(link.target_blank);
    $('#link_category_id').val(link.category_id);
    $('#linkModal').modal('show');
}

function submitLink() {
    var id = $('#link_id').val();
    var data = {
        id: id,
        category_id: $('#link_category_id').val(),
        title: $('#link_title').val(),
        url: $('#link_url').val(),
        icon: $('#link_icon').val(),
        color: $('#link_color').val(),
        description: $('#link_desc').val(),
        sort_order: $('#link_sort').val(),
        status: $('#link_status').val(),
        target_blank: $('#link_target').val()
    };
    postAction(id ? 'update_link' : 'add_link', data, '#linkSubmitBtn');
}

function deleteItem(action, id, name) {
    $.confirm('确定删除该' + name + '？', function() {
        postAction(action, {id: id});
    });
}
</script>
