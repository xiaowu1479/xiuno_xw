var xwIconTarget = '';

function showIconPicker(targetId) {
    xwIconTarget = targetId;
    $('#iconPickerSearch').val('');
    renderIconPicker('');
    $('#iconPickerModal').modal('show');
    setTimeout(function(){ $('#iconPickerSearch').focus(); }, 300);
}

function renderIconPicker(keyword) {
    keyword = (keyword || '').toLowerCase();
    var html = '';
    XW_ICON_GROUPS.forEach(function(g) {
        var icons = g.icons.filter(function(ic) {
            return !keyword || ic.toLowerCase().indexOf(keyword) !== -1;
        });
        if(!icons.length) return;
        html += '<div class="mb-2"><div class="text-muted small mb-1">' + g.name + '</div><div class="d-flex flex-wrap">';
        icons.forEach(function(ic) {
            html += '<a href="javascript:;" class="xw-icon-item" data-icon="' + ic + '" title="' + ic + '" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #eee;border-radius:4px;margin:2px;font-size:18px;color:#333;">'
                 + '<i class="' + ic + '"></i></a>';
        });
        html += '</div></div>';
    });
    if(!html) html = '<div class="text-center text-muted py-4">没有匹配的图标</div>';
    $('#iconPickerBody').html(html);
}

$(document).on('click', '.xw-icon-item', function() {
    var icon = $(this).data('icon');
    $('#' + xwIconTarget).val(icon);
    $('#iconPickerModal').modal('hide');
});

$(document).on('input', '#iconPickerSearch', function() {
    renderIconPicker($(this).val());
});

function postAction(action, data, btn) {
    data = data || {};
    data.xw_nav_action = action;
    $(btn || '#body').loading();
    $.xpost(baseUrl, data, function(code, message) {
        $(btn || '#body').loading('close');
        if(code == 0) {
            $.alert(message || '操作成功', function(){ location.reload(); });
        } else {
            $.alert(message || '操作失败');
        }
    });
}

// 设置
$('#xw_nav_settings_form').on('submit', function(e) {
    e.preventDefault();
    var data = {};
    $(this).serializeArray().forEach(function(item) { data[item.name] = item.value; });
    postAction('save_settings', data, '#xw_nav_settings_form button[type="submit"]');
});
