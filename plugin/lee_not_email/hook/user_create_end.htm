<script>
// 页面正文里的脚本先于 jQuery 加载，这里用原生事件委托
function lee_email_hide_modal(modalEl) {
    if (!modalEl) return;
    // 兼容 Bootstrap 4（当前系统使用）与 Bootstrap 5 两种弹窗 API
    if (window.bootstrap && bootstrap.Modal && bootstrap.Modal.getOrCreateInstance) {
        bootstrap.Modal.getOrCreateInstance(modalEl).hide();
    } else if (window.jQuery && jQuery.fn.modal) {
        jQuery(modalEl).modal('hide');
    }
}
document.addEventListener('click', function(e) {
    var closeBtn = e.target.closest ? e.target.closest('[data-dismiss="modal"]') : null;
    if (closeBtn) {
        lee_email_hide_modal(closeBtn.closest('.modal'));
        return;
    }
    if (e.target && e.target.classList && e.target.classList.contains('modal')) {
        lee_email_hide_modal(e.target);
    }
});
</script>
