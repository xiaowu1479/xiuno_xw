<script>
// 页面正文里的脚本先于 jQuery 加载，这里用原生事件委托（点击时才使用 jQuery/Bootstrap）
document.addEventListener('click', function(e) {
    var btn = e.target.closest ? e.target.closest('[data-target="#the_email"]') : null;
    if (!btn) return;
    e.preventDefault();
    var el = document.getElementById('the_email');
    if (el && !el.classList.contains('show')) {
        // 兼容 Bootstrap 4（当前系统使用）与 Bootstrap 5 两种弹窗 API
        if (window.bootstrap && bootstrap.Modal && bootstrap.Modal.getOrCreateInstance) {
            bootstrap.Modal.getOrCreateInstance(el).show();
        } else if (window.jQuery && jQuery.fn.modal) {
            jQuery(el).modal('show');
        }
    }
});
</script>
