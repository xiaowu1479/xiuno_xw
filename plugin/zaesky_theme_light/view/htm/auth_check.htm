<script>
$('#nav li.nav-item-light').addClass('active');
    var jform = $("#form");
    var jsubmit = $("#submit");
    jform.on('submit', function(event) {
        event.preventDefault(); // Prevent default form submission
        $('body').mLoading({ text: "验证中，请稍等..." });
        jsubmit.button('loading');

        var postdata = jform.serialize() + "&type=auth_check";
        $.xpost(jform.attr('action'), postdata, function(code, message) {
            $('body').mLoading('destroy'); // Always destroy loading indicator first
            jsubmit.button('reset'); // Reset button state at the end

            if (code === 0) {
                console.log(message);
                var url = '<?php echo url("plugin-setting-zaesky_theme_light");?>';
                $.xpost(url, { 'type': 'update_check' }, function(code, message) {
                    if (message.data.data.code === 1) {
                        $('body').mLoading({ text: "下载更新中，请稍等..." });
                        $.xpost(url, { 'type': 'update' }, function(code, message) {
                            $('body').mLoading('destroy');
                            $.alert(message.msg);
                              $.xpost(xn.url("other-cache"),"clear_tmp=1&clear_cache=1", function(code, message) {
                                  if(code == 0) {
                                    setTimeout(() => window.location.reload(), 1000);
                                  }
                              });
                        });
                    } else {
                        $.alert('验证成功！即将为您刷新页面！');
                        setTimeout(() => window.location.reload(), 1000);
                    }
                });
            } else {
                $.alert(message);
            }
        });
    });
</script>
