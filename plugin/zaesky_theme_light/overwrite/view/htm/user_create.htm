<script>
var jform = $('#form');
var jsubmit = $('#submit');
var jsend = $('#sendcode');
var referer = '<?php echo http_referer();?>';
jform.find('.captcha-img').on('click', function() {
    $(this).attr('src', '?captcha.htm&r=' + Math.random());
});
jsend.on('click', function() {
    jform.reset();
    jsend.button('loading');
    var postdata = jform.serialize();
    $.xpost(jsend.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            $('#code').focus();
            var t = 60;
            jsend.button('<?php echo lang('user_send_sucessfully');?> 60 ');
            jsubmit.button('reset');
            var handler = setInterval(function() {
                jsend.button('<?php echo lang('user_send_sucessfully');?> '+(--t)+' ');
                if(t == 0) {
                    clearInterval(handler);
                    jsend.button('reset');
                }
            }, 1000);
        } else if(code < 0) {
            $.alert(message, -1);
            jsend.button('reset');
        } else {
            jform.find('[name="'+code+'"]').alert(message).focus();
            jsend.button('reset');
        }
    });
    return false;
});

jform.on('submit', function() {
    var postdata = jform.serializeObject();
    jsubmit.button('loading');
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            jsubmit.button(message).delay(1000).location(referer);
        } else if(xn.is_number(code)) {
            alert(message);
            jsubmit.button('reset');
        } else {
            jform.find('[name="'+code+'"]').alert(message).focus();
            jsubmit.button('reset');
            if(code == 'captcha') jform.find('.captcha-img').attr('src', '?captcha.htm&r=' + Math.random());
        }
    });
    return false;
});
</script>
