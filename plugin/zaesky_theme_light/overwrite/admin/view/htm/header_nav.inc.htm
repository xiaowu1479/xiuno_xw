<script>
  function sidebar_toggle() {
    if (window.innerWidth > 991) {
      document.getElementById("page-container").classList.toggle("sidebar-o");
        } else {
          document.getElementById("page-container").classList.toggle("sidebar-o-xs");
        }
      }

      function sidebar_close() {
        if (window.innerWidth > 991) {
          document.getElementById("page-container").classList.remove("sidebar-o");
        } else {
          document.getElementById("page-container").classList.remove("sidebar-o-xs");
        }
      }
</script>
