<script>
    let lastBookmarkTime = 0;
    function bookmarkSite() {
        <?php if (!empty($user)) { ?>
            // 防抖检查（500ms内只能点击一次）
            const now = Date.now();
            if (now - lastBookmarkTime < 500) return;
            lastBookmarkTime = now;
            const badge = document.querySelector('.bookmark-badge');
            badge.classList.add('bookmark-animation');
            
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '<i class="fas fa-heart"></i>';
            document.body.appendChild(heart);
            
            const rect = badge.getBoundingClientRect();
            heart.style.left = (rect.left + rect.width/2) + 'px';
            heart.style.top = rect.top + 'px';
            
            setTimeout(() => {
                badge.classList.remove('bookmark-animation');
                document.body.removeChild(heart);
            }, 1500);
            $.xpost(xn.url("my-posttest"),function(code,message){
            if(code == 0){
                $('.like_counts').text(function(i, oldText) {
                    return Number(oldText) + 1;
                });
                cocoMessage.success(message, 1000);
            }else{
                cocoMessage.error(message, 1000);
                }
            });
        <?php } else { ?> 
            cocoMessage.error("请先登录后操作！", 3000);
        <?php } ?>
    }
</script>
