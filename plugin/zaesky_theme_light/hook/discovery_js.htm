<script>

        const scrollableContainer = document.querySelector('.recent-active-users-scrollable-container');
        let isDragging = false;
        let dragStartX;
        let scrollStartPosition;

        scrollableContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            scrollableContainer.classList.add('dragging-active');
            dragStartX = e.pageX - scrollableContainer.offsetLeft;
            scrollStartPosition = scrollableContainer.scrollLeft;
            e.preventDefault(); // 防止默认的选择行为
        });

        scrollableContainer.addEventListener('mouseleave', () => {
            isDragging = false;
            scrollableContainer.classList.remove('dragging-active');
        });

        scrollableContainer.addEventListener('mouseup', () => {
            isDragging = false;
            scrollableContainer.classList.remove('dragging-active');
        });

        scrollableContainer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); // 防止拖动时的选择
            const currentDragX = e.pageX - scrollableContainer.offsetLeft;
            const dragDistance = (currentDragX - dragStartX) * 2;
            scrollableContainer.scrollLeft = scrollStartPosition - dragDistance;
        });

        // 禁用整个容器的文本选择
        scrollableContainer.addEventListener('selectstart', (e) => {
            e.preventDefault();
        });
  </script>
