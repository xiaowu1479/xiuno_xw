<?php
$tagid1 = $tagid1 ?? 0;
$tagid2 = $tagid2 ?? 0;
$tagid3 = $tagid3 ?? 0;
$tagid4 = $tagid4 ?? 0;
$fid = $fid ?? 0;
?>
<div class="tag_filter_bar mb-3">
	<?php if(!empty($forum['tagcatelist'])) {foreach($forum['tagcatelist'] as $i=>$tagcate) { ?>
		<div class="tag_filter_row d-flex align-items-center flex-wrap mb-2">
			<span class="tag_filter_label text-muted me-2"><?php echo $tagcate['name'];?>：</span>
			<div class="tag_filter_tags d-flex flex-wrap">
				<?php
					$tagidadd = '';
					$tagactive = '';
					switch ($i) {
						case 0: $tagidadd = "0_{$tagid2}_{$tagid3}_{$tagid4}";
							$tagactive = 0 == $tagid1 ? ' active' : '';
							break;
						case 1: $tagidadd = "{$tagid1}_0_{$tagid3}_{$tagid4}";
							$tagactive = 0 == $tagid2 ? ' active' : '';
							break;
						case 2: $tagidadd = "{$tagid1}_{$tagid2}_0_{$tagid4}";
							$tagactive = 0 == $tagid3 ? ' active' : '';
							break;
						case 3: $tagidadd = "{$tagid1}_{$tagid2}_{$tagid3}_0";
							$tagactive = 0 == $tagid4 ? ' active' : '';
							break;
					}
				?>
				<a href="<?php echo url("forum-$fid-1", array('tagids'=>$tagidadd));?>" class="tag_box tag_box-secondary<?php echo $tagactive;?>"><?php echo lang('all');?></a>
				<?php foreach($tagcate['taglist'] as $tag) { ?>
				<?php 
					switch ($i) {
						case 0: 
							$tagidadd = "{$tag['tagid']}_{$tagid2}_{$tagid3}_{$tagid4}";
							$tagactive = $tag['tagid'] == $tagid1 ? ' active' : '';
							break;
						case 1: $tagidadd = "{$tagid1}_{$tag['tagid']}_{$tagid3}_{$tagid4}";
							$tagactive = $tag['tagid'] == $tagid2 ? ' active' : '';
							break;
						case 2: $tagidadd = "{$tagid1}_{$tagid2}_{$tag['tagid']}_{$tagid4}";
							$tagactive = $tag['tagid'] == $tagid3 ? ' active' : '';
							break;
						case 3: $tagidadd = "{$tagid1}_{$tagid2}_{$tagid3}_{$tag['tagid']}";
							$tagactive = $tag['tagid'] == $tagid4 ? ' active' : '';
							break;
					}
				?>
				<a href="<?php echo url("forum-$fid-1", array('tagids'=>$tagidadd));?>" class="tag_box tag_box-<?php echo empty($tag['style']) ? 'secondary' : $tag['style'];?><?php echo $tagactive;?>"><?php echo $tag['name'];?></a>
				<?php } ?>
			</div>
		</div>
	<?php }} ?>
</div>
