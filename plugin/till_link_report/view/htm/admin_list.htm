<script>
$('#nav li.nav-item-plugin').addClass('active');

$('#select_all').on('change', function() {
	$('.report_item').prop('checked', this.checked);
});

$('#batch_delete').on('click', function() {
	var ids = [];
	$('.report_item:checked').each(function() {
		ids.push($(this).val());
	});
	if(ids.length == 0) return $.alert('<?php echo lang('please_select');?>');
	$.confirm('<?php echo lang('confirm_delete');?> ' + ids.length + ' <?php echo lang('items');?>', function() {
		$.xpost(url('link_report-delete'), {ids: ids}, function(code, msg) {
			if(code != 0) return $.alert(msg);
			window.location.reload();
		});
	});
});

function del_report(id) {
	$.confirm('<?php echo lang('confirm_delete');?>', function() {
		$.xpost(url('link_report-delete'), {id: id}, function(code, msg) {
			if(code != 0) return $.alert(msg);
			window.location.reload();
		});
	});
}
</script>
