<script ajax-eval="true">

// 接受传参
var args = args || {jmodal: null, callback: null, arg: null};
var jmodal = args.jmodal;
var callback = args.callback;

// 兼容：若弹窗内容为 JS 直接传入的 uid，则设置隐藏字段（value 为 0 时也覆盖）
var curUid = $('.ax-sx-id').val();
if (args.arg && (curUid === '0' || !curUid)) {
    $('.ax-sx-id').val(args.arg);
}

var jform = $('#ax_form');
var jsubmit = jform.find('button[type="submit"]');
var jchatbody = $('.ax-chat-body');

// 滚动到底部
jchatbody.scrollTop(jchatbody[0].scrollHeight);

jform.on('submit', function() {
    jform.reset();
    jsubmit.button('loading');
    var postdata = jform.serializeObject();
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            // 本地追加一条自己的消息
            var text = postdata.ax_message || '';
            if (text) {
                var html = '<div class="d-flex justify-content-end mb-3"><div class="d-flex flex-row-reverse align-items-end" style="max-width:80%;"><img class="avatar-2 rounded-circle" style="width:28px;height:28px;" src="<?php echo $conf['view_url'];?>img/avatar.png"><div class="ml-2 mr-2"><div class="small text-muted text-right" style="font-size:11px;">我 · 刚刚</div><div class="ax-chat-bubble px-3 py-2 mt-1 d-inline-block" style="border-radius:10px;background:#2d8cf0;color:#fff;white-space:pre-wrap;word-break:break-word;">' + $('<div>').text(text).html() + '</div></div></div></div>';
                jchatbody.append(html);
                jchatbody.scrollTop(jchatbody[0].scrollHeight);
            }
            jform.find('.axinput').val('');
            jsubmit.button('reset');
            if(callback) callback(message);
        } else {
            $.alert(message);
            jsubmit.button('reset');
        }
    });
    
    return false;
});

</script>
