<script>

// 模板初始化
var maxrowid = Math.max(xn.array_keys(smtplist));
var smtplist = <?php echo xn_json_encode($smtplist);?>;
var jsmtp_tpl = $('#smtp_tpl');
var jsmtp_body = $('#smtp_body');
var tpl = jsmtp_tpl.text();
function row_add(v) {
	var s = xn.template(tpl, v);
	jsmtp_body.append(s);
}
$.each(smtplist, function(k, v) {
	v.rowid = k;
	row_add(v);
});

var jform = $("#form");
var jsubmit = $("#submit");
jform.on('submit', function(){
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			jsubmit.text(message).delay(1000).button('reset');
			return;
		} else {
			alert(message);
			jsubmit.button('reset');
		}
	});
	return false;
});

// 测试发信：用页面上该行当前填写的配置（含尚未保存的修改）发一封测试邮件
var SMTP_TEST_TEXT = '<?php echo lang('smtp_test');?>';
var SMTP_TEST_SENDING = '<?php echo lang('smtp_test_sending');?>';
$('.arrlist').on('click', 'a.row_test', function() {
	var jbtn = $(this);
	var jtr = jbtn.parents('tr');
	var testTo = $.trim($('#test_email').val());
	if(!testTo) {
		alert('<?php echo lang('smtp_test_email_required');?>');
		$('#test_email').focus();
		return false;
	}
	// 行号取「前面还有多少个 tr」，与后端 email[] / host[] 数组下标一致
	var postdata = jform.serializeArray();
	postdata.push({name: 'smtp_action', value: 'test'});
	postdata.push({name: 'test_row', value: jtr.prevAll('tr').length});
	postdata.push({name: 'test_email', value: testTo});
	jbtn.text(SMTP_TEST_SENDING);
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		jbtn.text(SMTP_TEST_TEXT);
		$.alert(message);
	});
	return false;
});

// 删除 delete
var jarrlist = $('.arrlist');
var jdelete = $('a.row_delete');
jarrlist.on('click', 'a.row_delete', function() {
	var jthis = $(this);
	var jtr = jthis.parents('tr');
	var rowid = jtr.attr('rowid');
	jtr.remove();
	return false;
});

// 增加 add
var jadd = $('a.row_add');
jadd.on('click', function() {
	var v = {email: '', host: '', port: '', user: '', pass: '', rowid: ++maxrowid};
	row_add(v);
	return false;
});


$('#nav li.nav-item-setting').addClass('active');

</script>
