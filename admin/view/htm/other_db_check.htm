<script>
$(function(){
	$('#fixBtn').on('click', function(){
		var jbtn = $(this);
		jbtn.prop('disabled', true).text('修复中...');
		$.xpost(xn.url('other-db_check'), {}, function(code, message){
			if(code == 0){
				$.alert(message);
				jbtn.text('修复完成').removeClass('btn-warning').addClass('btn-success');
				setTimeout(function(){ location.reload(); }, 1500);
			} else {
				$.alert(message);
				jbtn.prop('disabled', false).text('一键修复');
			}
		});
	});
});
</script>
