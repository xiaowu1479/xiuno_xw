<script>
// 删除单个附件
$(document).on('click', '.attach_delete', function() {
	var ja = $(this);
	var tr = ja.parents('tr');
	var aid = ja.attr('aid');
	var is_orphan = tr.find('.badge-danger').length > 0;
	var msg = is_orphan
		? '<?php echo lang('admin_attach_delete_confirm_orphan');?>'
		: '<?php echo lang('admin_attach_delete_confirm_used');?>';
	if(!window.confirm(msg)) return false;
	$.xpost(xn.url('attach-delete'), {aid:aid}, function(code, message) {
		if(code != 0) return $.alert(message);
		tr.fadeOut(200, function(){ $(this).remove(); });
	});
	return false;
});

// 一键清理未被引用的附件
$('#clean_orphan').on('click', function() {
	if(!window.confirm('<?php echo lang('admin_attach_clean_confirm');?>')) return false;
	var jbtn = $(this);
	jbtn.attr('disabled', true).text('<?php echo lang('admin_attach_cleaning');?>');
	$.xpost(xn.url('attach-clean_orphan'), {}, function(code, message) {
		if(code != 0) {
			jbtn.attr('disabled', false).text('<?php echo lang('admin_attach_clean_orphan');?>');
			return $.alert(message);
		}
		$.alert(message);
		setTimeout(function(){ window.location.reload(); }, 1200);
	});
	return false;
});

$('#nav li.nav-item-attach').addClass('active');
</script>
