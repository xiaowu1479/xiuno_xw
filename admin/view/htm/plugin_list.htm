<script>
$('#nav li.nav-item-plugin').addClass('active');

// 全选 / 取消全选
$('#checkall').on('click', function() {
	$('.plugin-cb').prop('checked', this.checked);
});

// 批量安装
$('#install-batch').on('click', function() {
	var dirs = [];
	$('.plugin-cb:checked').each(function() {
		dirs.push($(this).val());
	});
	if(dirs.length == 0) {
		$.alert(lang('please_select_plugin'));
		return;
	}
	$.xpost('<?php echo url("plugin-install_batch"); ?>', {dirs: dirs}, function(code, message) {
		if(code == 0) {
			window.location.reload();
		} else {
			$.alert(message);
		}
	});
});

// 批量卸载
$('#unstall-batch').on('click', function() {
	var dirs = [];
	$('.plugin-cb:checked').each(function() {
		dirs.push($(this).val());
	});
	if(dirs.length == 0) {
		$.alert(lang('please_select_plugin'));
		return;
	}
	$.confirm('<?php echo lang('plugin_unstall_batch_confirm_tips');?>', function() {
		$.xpost('<?php echo url("plugin-unstall_batch"); ?>', {dirs: dirs}, function(code, message) {
			if(code == 0) {
				window.location.reload();
			} else {
				$.alert(message);
			}
		});
	});
});
</script>
