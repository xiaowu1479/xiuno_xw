<script>
function toggleAll(source) {
	var checkboxes = document.querySelectorAll('input[name="tids[]"]');
	for(var i = 0; i < checkboxes.length; i++) {
		checkboxes[i].checked = source.checked;
	}
	updateBatchBtn();
}
function updateBatchBtn() {
	var checkboxes = document.querySelectorAll('input[name="tids[]"]:checked');
	document.getElementById('batch_delete_btn').disabled = checkboxes.length === 0;
}
function batchDelete() {
	var checkboxes = document.querySelectorAll('input[name="tids[]"]:checked');
	if(checkboxes.length === 0) return;
	if(!confirm('确定要删除选中的 ' + checkboxes.length + ' 个主题吗？此操作不可恢复！')) return;
	var tids = [];
	for(var i = 0; i < checkboxes.length; i++) {
		tids.push(checkboxes[i].value);
	}
	$.xpost('?thread-batch_delete.htm', {tids: tids.join(',')}, function(code, message) {
		if(code == 0) {
			location.reload();
		} else {
			$.alert(message);
		}
	});
}
function batchDeleteOne(tid) {
	if(!confirm('确定要删除主题 #' + tid + ' 吗？此操作不可恢复！')) return;
	$.xpost('?thread-batch_delete.htm', {tids: '' + tid}, function(code, message) {
		if(code == 0) {
			location.reload();
		} else {
			$.alert(message);
		}
	});
}
</script>
