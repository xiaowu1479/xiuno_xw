	<script>
	/* 移动端抽屉菜单：点三条杠打开左侧版块菜单，点遮罩 / 关闭按钮 / 链接 / ESC 关闭 */
	(function () {
		var body = document.body;
		var toggle = document.getElementById('xw-nav-toggle');
		var nav = document.getElementById('nav');
		if (!toggle || !nav) return;
		function setOpen(open) {
			if (open) {
				body.classList.add('xw-nav-open');
			} else {
				body.classList.remove('xw-nav-open');
			}
			toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
		}
		toggle.addEventListener('click', function (e) {
			e.preventDefault();
			setOpen(!body.classList.contains('xw-nav-open'));
		});
		var backdrop = document.querySelector('.xw-nav-backdrop');
		if (backdrop) backdrop.addEventListener('click', function () { setOpen(false); });
		var closeBtn = document.querySelector('.xw-drawer-close');
		if (closeBtn) closeBtn.addEventListener('click', function () { setOpen(false); });
		document.addEventListener('keydown', function (e) {
			if (e.key === 'Escape' || e.keyCode === 27) setOpen(false);
		});
		nav.addEventListener('click', function (e) {
			var el = e.target;
			while (el && el !== nav) {
				if (el.tagName === 'A') { setOpen(false); break; }
				el = el.parentNode;
			}
		});
		window.addEventListener('resize', function () {
			if (window.innerWidth >= 992) setOpen(false);
		});
	})();
	</script>
	
	<!-- 夜间模式切换：点一下必定在 日间 / 夜间 之间翻转（不再有"点了没反应"的那一下）
	     访客的手动选择只在「站点时段没翻篇」时有效，时段翻篇后自动回到跟随时段
	     写 localStorage 并切换 <html data-theme>，图标由 dark.css 按 data-theme 显示/隐藏 -->
	<script>
	(function () {
		var AUTO = '<?php echo $xw_theme_auto;?>';   // dark / light / os
		var MODE = {
			auto: '<?php echo addslashes(lang('theme_mode_auto'));?>',
			light: '<?php echo addslashes(lang('theme_mode_light'));?>',
			dark: '<?php echo addslashes(lang('theme_mode_dark'));?>'
		};
		var BASE = '<?php echo addslashes($theme_toggle_title);?>';

		function read(k) {
			try { return localStorage.getItem(k); } catch (e) { return null; }
		}
		function write(k, v) {
			try { if (v === null) { localStorage.removeItem(k); } else { localStorage.setItem(k, v); } } catch (e) {}
		}
		// 当前生效的手动选择；站点时段翻篇后返回 null，表示回到跟随时段
		function manual() {
			var s = read('xw_theme');
			return (s === 'dark' || s === 'light') && read('xw_theme_auto') === AUTO ? s : null;
		}
		// 自动档解析成实际主题（与页头预置脚本同一套规则）
		function autoTheme() {
			if (AUTO === 'dark' || AUTO === 'light') return AUTO;
			return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
		}
		// 悬停提示：手动固定时显示具体模式，跟随时段时说明是自动
		function syncTitle() {
			var m = manual();
			var txt = m ? MODE[m] : (AUTO === 'os' ? MODE[autoTheme()] : MODE.auto);
			var els = document.querySelectorAll('.xw-theme-toggle');
			for (var i = 0; i < els.length; i++) {
				els[i].setAttribute('title', txt + ' ｜ ' + BASE);
				els[i].setAttribute('aria-label', txt);
			}
		}

		document.addEventListener('click', function (e) {
			var el = e.target;
			while (el && el.parentNode) {
				if (el.classList && el.classList.contains('xw-theme-toggle')) {
					// 只看当前实际显示的主题：点一下必定翻转，不存在"点了没反应"的那一下
					var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
					document.documentElement.setAttribute('data-theme', next);
					write('xw_theme', next);
					write('xw_theme_auto', AUTO);   // 记下选择时的时段，便于翻篇后自动回落
					syncTitle();
					if (e.preventDefault) e.preventDefault();
					return false;
				}
				el = el.parentNode;
			}
		}, false);

		syncTitle();
	})();
	</script>
